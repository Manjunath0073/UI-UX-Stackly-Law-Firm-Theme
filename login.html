<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Stackly Law Firm</title>
    <meta
      name="description"
      content="Login to your Stackly Law Firm account to access case updates and legal consultations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-page">
      <a href="index.html" class="auth-home" aria-label="Go back to home page">
        <span class="auth-home-arrow" aria-hidden="true">&larr;</span>
        Go Home
      </a>

      <div class="auth-card">
        <div class="auth-card-head">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">
            Log in to access your legal dashboard, appointments, and case updates.
          </p>
        </div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="loginEmail">Email</label>
            <div class="auth-input-wrap">
              <svg
                class="auth-input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <input
                class="auth-input"
                type="email"
                id="loginEmail"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
              />
            </div>
            <span class="auth-error" id="loginEmailError"></span>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="loginPassword">Password</label>
            <div class="auth-input-wrap">
              <svg
                class="auth-input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                class="auth-input"
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="auth-toggle"
                data-toggle="loginPassword"
                aria-label="Show password"
              >
                <svg
                  class="auth-eye-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="auth-eye-icon auth-eye-icon--off"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <span class="auth-error" id="loginPasswordError"></span>
          </div>

          <div class="auth-field">
            <label class="auth-label" id="roleLabel">Select Role</label>
            <div class="auth-role" role="radiogroup" aria-labelledby="roleLabel">
              <label class="auth-role-option">
                <input type="radio" name="role" value="user" checked />
                <span class="auth-role-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </span>
                <span class="auth-role-text">
                  <span class="auth-role-name">User</span>
                  <span class="auth-role-desc">Client account</span>
                </span>
                <span class="auth-role-check" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
              </label>
              <label class="auth-role-option">
                <input type="radio" name="role" value="admin" />
                <span class="auth-role-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <path d="M9 12l2 2 4-4" />
                  </svg>
                </span>
                <span class="auth-role-text">
                  <span class="auth-role-name">Admin</span>
                  <span class="auth-role-desc">Firm staff</span>
                </span>
                <span class="auth-role-check" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
              </label>
            </div>
          </div>

          <div class="auth-options">
            <label class="auth-check">
              <input type="checkbox" id="rememberMe" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="404.html" class="auth-link">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-submit">Login</button>
        </form>

        <div class="auth-social">
          <div class="auth-social-divider">
            <span>Or continue with</span>
          </div>
          <div class="auth-social-icons">
            <a href="404.html" class="auth-social-icon" aria-label="Continue with Google">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/>
              </svg>
            </a>
            <a href="404.html" class="auth-social-icon" aria-label="Continue with Facebook">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
            </a>
            <a href="404.html" class="auth-social-icon" aria-label="Continue with Apple">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702z"/>
              </svg>
            </a>
          </div>
        </div>

        <p class="auth-switch">
          Don&rsquo;t have an account? <a href="signup.html">Sign Up</a>
        </p>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
